apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: troubleshoot-lab
  labels:
    app: hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:this-tag-does-not-exist
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi

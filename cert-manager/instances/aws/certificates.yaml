apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: router-certs
  namespace: openshift-ingress
spec:
  secretName: router-certs
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: "PLACEHOLDER_APPS_DOMAIN"
  dnsNames:
    - "PLACEHOLDER_APPS_DOMAIN"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-cert
  namespace: openshift-config
spec:
  secretName: api-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - PLACEHOLDER_API_HOST

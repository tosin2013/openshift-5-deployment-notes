apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: PLACEHOLDER_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          azureDNS:
            subscriptionID: PLACEHOLDER_AZURE_SUBSCRIPTION_ID
            resourceGroupName: PLACEHOLDER_AZURE_RESOURCE_GROUP
            hostedZoneName: PLACEHOLDER_AZURE_ZONE_NAME
            environment: AzurePublicCloud
            clientID: PLACEHOLDER_AZURE_CLIENT_ID
            clientSecretSecretRef:
              name: azure-dns-sp
              key: client-secret
            tenantID: PLACEHOLDER_AZURE_TENANT_ID
